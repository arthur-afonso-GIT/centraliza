databases:
  - name: centraliza-db
    plan: free
    databaseName: centraliza
    user: centraliza

services:
  - type: web
    name: centraliza-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: uv sync --locked
    startCommand: uv run python manage.py migrate --noinput && uv run python manage.py bootstrap_manager && uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: centraliza-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://centralizavisat.vercel.app
      - key: DJANGO_SECRET_KEY
        generateValue: true
